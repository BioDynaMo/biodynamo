name: macOS CI

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
    # Checkout first: the dependency step reads the package list from the repo.
    - name: Checkout BioDynaMo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1

        # GHA macOS: unpin CMake to fix Homebrew conflict (actions/runner-images#12912).
        # 'brew untap' on a tap that was never created is not an error we care
        # about, so no need to special case runners that lack local/pinned.
        brew uninstall --force cmake || true
        brew untap local/pinned || true

        # Install exactly what util/installation/osx expects, so that this
        # workflow and a user following the prerequisites cannot drift apart.
        # libgit2 and boost are named on top of the required list because they
        # are optional packages that this job still needs: it builds with
        # -Dlibgit2=ON, and -Dboost=ON silently turns itself off when Boost is
        # missing, which would stop the RegulatoryNetwork behaviour from being
        # exercised at all.
        brew install $(cat util/installation/osx/package_list_required) libgit2 boost

    # - name: Cache Third Party Packages
    #   uses: actions/cache@v4
    #   with:
    #     path: build/third_party
    #     key: ${{ runner.os }}-third-party-${{ hashFiles('cmake/external/SHA256Digests.cmake') }}

    - name: Build BioDynaMo
      shell: bash
      run: |
        cmake -G Ninja \
          -Dopencl=OFF \
          -Dparaview=ON \
          -Dbenchmark=ON \
          -Dlibgit2=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -B build
        cmake --build build --parallel --config Release

    - name: Unit tests BioDynaMo
      shell: bash
      working-directory: build
      run: |
        . bin/thisbdm.sh
        root --version
        root -config
        bdm config
        ninja run-unit-tests
